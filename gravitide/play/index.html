<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070d16">
  <title>Gravitide · One gravity throw</title>
  <meta name="description" content="Hold to bend an orbit. Release to sling a fragment into an enemy. Play one Gravitide throw right in your browser.">
  <meta property="og:title" content="Gravitide · One gravity throw">
  <meta property="og:description" content="Can you hit the target with a single piece of space debris? Play in your browser.">
  <meta property="og:image" content="https://kostyabl.github.io/assets/gravitide.png">
  <meta property="og:url" content="https://kostyabl.github.io/gravitide/play/">
  <link rel="icon" href="../../assets/gravitide.png">
  <link rel="stylesheet" href="play.css">
  <script defer src="orbit.js"></script>
  <script defer src="play.js"></script>
  <script defer src="/google-analytics.js"></script>
  <script defer src="/site-metrics.js"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="../../#games"><img src="../../assets/gravitide.png" alt="" width="36" height="36">Gravitide</a><span id="edition">Browser demo</span></header>
    <section class="arena" aria-labelledby="title">
      <div class="brief"><h1 id="title">Gravity throw</h1><p id="mission">Hit the target with a piece of space debris.</p></div>
      <div id="field"><canvas aria-hidden="true"></canvas></div>
      <div id="panel">
        <p id="status" role="status" aria-live="polite">Hold to capture the fragment. Release when the dotted line crosses the target.</p>
        <div class="actions"><button type="button" id="control" aria-describedby="status">Hold to charge</button><a id="store" class="cta" href="https://apps.apple.com/app/apple-store/id6809525146?pt=32945803&amp;ct=gravitide_web_throw&amp;mt=8" hidden>Play on iPhone</a></div>
        <small id="hint">Touch, mouse or Space</small>
      </div>
    </section>
    <noscript>This playable demo needs JavaScript. <a href="https://apps.apple.com/app/apple-store/id6809525146?pt=32945803&amp;ct=gravitide_web_throw&amp;mt=8">Play Gravitide on iPhone</a>.</noscript>
  </main>
</body>
</html>

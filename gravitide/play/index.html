<head>
  <meta charset="utf-8">

  <title>Gravitide · Five-target run</title>
  <meta name="description" content="Hold to bend an orbit. Release to sling a fragment into an enemy. Clear five targets in as few throws as you can.">
  <meta property="og:title" content="Gravitide · Five-target run">
  <meta property="og:description" content="Move your gravity ring and intercept the final two flyers. Can you clear five targets in five throws?">
  <meta property="og:image" content="https://kostyabl.github.io/assets/gravitide.png">
  <meta property="og:url" content="https://kostyabl.github.io/gravitide/play/">

<body>
  <main>
    <header><a class="brand" href="../../#games"><img src="../../assets/gravitide.png" alt="" width="36" height="36">Gravitide</a><span id="edition">Browser demo</span></header>
    <section class="arena" aria-labelledby="title">
      <div class="brief"><h1 id="title">Gravity throw</h1><p id="mission">Clear five targets in as few throws as you can.</p><div class="run-hud"><span id="progress"></span><span id="shots"></span><span id="best" hidden></span></div></div>
      <div id="field"><canvas aria-hidden="true"></canvas></div>
      <div id="panel">
        <p id="status" role="status" aria-live="polite">Hold to orbit. Drag to move the ring. Release to throw.</p>
        <div class="actions"><button type="button" id="control" aria-describedby="status">Hold to orbit</button><button type="button" id="replay" hidden>Play again</button><a id="store" class="cta" href="https://apps.apple.com/app/apple-store/id6809525146?pt=32945803&amp;ct=gravitide_web_throw&amp;mt=8" hidden>Play on iPhone</a></div>
        <small id="hint">Touch, mouse or Space</small>
      </div>
    </section>
    <noscript>This playable demo needs JavaScript. <a href="https://apps.apple.com/app/apple-store/id6809525146?pt=32945803&amp;ct=gravitide_web_throw&amp;mt=8">Play Gravitide on iPhone</a>.</noscript>
  </main>
</body>
